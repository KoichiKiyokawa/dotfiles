[settings]
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["node"]

[vars]
root = "{{ config_source | canonicalize | dirname | dirname }}"

[env]
DOTFILES_ROOT = "{{ vars.root }}"

[tools]
node = "lts"
aws-cli = "latest"
codex = { version = "latest", os = ["macos"] }
gcloud = { version = "latest", os = ["macos"], depends = ["python"] }
gh = "latest"
go = "latest"
jq = "latest"
lazygit = "latest"
mas = { version = "latest", os = ["macos"] }
neovim = "latest"
peco = "latest"
pnpm = "latest"
python = { version = "latest", os = ["macos"] }
rtk = "latest"
starship = "latest"
uv = "latest"

[bootstrap.packages]
"brew:git" = "latest"
"brew:curl" = "latest"
"brew:sheldon" = "latest"
"brew-cask:google-chrome" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:karabiner-elements" = { os = "macos" }
"brew-cask:keycastr" = { os = "macos" }
"brew-cask:zed" = { os = "macos" }
"brew-cask:docker-desktop" = { os = "macos" }
"brew-cask:google-japanese-ime" = { os = "macos" }
"brew-cask:shottr" = { os = "macos" }
"brew-cask:vorssaint/tap/vorssaint" = { os = "macos" }
"brew-cask:t3-code" = { os = "macos" }
"mas:1423210932" = { os = "macos" } # Flow, requires App Store sign-in

[dotfiles]
"~/.zshrc" = { source = "~/dotfiles/zsh/.zshrc" }
"~/.config/sheldon/plugins.toml" = { source = "~/dotfiles/zsh/plugins.toml" }
"~/.config/zsh-abbr/user-abbreviations" = { source = "~/dotfiles/zsh/abbreviations" }
"~/.config/starship.toml" = { source = "~/dotfiles/zsh/starship.toml" }
"~/.config/lazygit/config.yml" = { source = "~/dotfiles/lazygit/config.yml" }
"~/.config/mise/config.toml" = { source = "~/dotfiles/mise/config.toml" }
"~/.config/rtk/config.toml" = { source = "~/dotfiles/rtk/config.toml" }
"~/.gitconfig" = { source = "~/dotfiles/.gitconfig" }
"~/.config/karabiner" = { source = "~/dotfiles/karabiner", variants = [{ os = "macos" }] }

[bootstrap.hooks.post-dotfiles]
run = 'touch "{{ vars.root }}/zsh/local.zsh"'

[bootstrap.files."/etc/pam.d/sudo_local"]
os = "macos"
content = "auth       sufficient     pam_tid.so\n"
owner = "root"
group = "wheel"
mode = "0644"

[tasks.bootstrap]
description = "Reapply App Store packages after [tools] installs mas on the first run; restore Vorssaint settings on every bootstrap"
run = '''
if [ "$(uname -s)" = Darwin ]; then
  mise bootstrap packages apply --manager mas
  "/Applications/Vorssaint.app/Contents/MacOS/Vorssaint" --import-settings "$DOTFILES_ROOT/Vorssaint Settings.plist"
fi
'''

[tasks."codex:setup"]
description = "Manually install Codex managed configuration and initialize RTK and context-mode integrations"
run = '''
rtk init -g --codex
if [ "$(uname -s)" = Darwin ]; then
  sudo install -d -o root -g wheel -m 0755 /etc/codex
  sudo install -o root -g wheel -m 0644 "$DOTFILES_ROOT/codex/managed_config.toml" /etc/codex/managed_config.toml
  codex plugin marketplace upgrade context-mode
  codex plugin add context-mode@context-mode
fi
'''

[tasks."vorssaint:export"]
description = "Export Vorssaint settings to the tracked plist"
run = '"/Applications/Vorssaint.app/Contents/MacOS/Vorssaint" --export-settings "{{ vars.root }}/Vorssaint Settings.plist"'
